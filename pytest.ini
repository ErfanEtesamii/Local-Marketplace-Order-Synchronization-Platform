[pytest]
# Real automated tests live only under tests/ (pytest + respx, one file
# per module - see README.md and tests/conftest.py). scripts/ holds
# manual/interactive smoke-test tools (test_telegram_bot_full.py,
# test_telegram_hashtags.py) that are meant to be run directly with
# `python scripts/<name>.py` against a REAL Telegram bot and real
# network - they are not pytest tests, they just happen to define
# functions named test_* for their own menu-driven CLI. Without this,
# pytest's default rootdir-wide discovery picks those up too and
# ERRORs on every one of them (they take plain positional arguments
# like `notifier`/`repository` that pytest tries and fails to resolve
# as fixtures). Restricting discovery to tests/ matches what the
# README already documents (`pytest tests/ -v`) and leaves scripts/
# untouched.
testpaths = tests
